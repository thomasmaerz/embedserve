name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy src/embedserve
      - run: uv run --frozen pytest
      - run: uv run --frozen python scripts/check_tracked_secrets.py
